name: Update stubs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate stubs
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the stubs branch
      pull-requests: write # open the pull request
      actions: write # dispatch CI, since GITHUB_TOKEN pushes do not trigger it
    env:
      BRANCH: chore/regen-stubs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup environment
        run: |
          pip install uv
          uv sync

      - name: Regenerate stubs
        run: uv run just stubs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- stubs/; then
            echo "Stubs are up to date"
            exit 0
          fi

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add stubs/
          git commit -m 'chore: regenerate stubs from upstream qBittorrent'
          git push --force origin "$BRANCH"

          if [[ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" == 0 ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'chore: regenerate stubs from upstream qBittorrent' \
              --body 'Regenerated by the `Update stubs` workflow from the latest upstream `src/searchengine/nova3`.'
          fi

          gh workflow run ci.yaml --ref "$BRANCH"
