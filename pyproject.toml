[project]
name = "qBittorrent-plugins"
description = "Plugins for qBittorrent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]

[dependency-groups]
dev = [
    "bandit",
    "isort",
    "mypy",
    "pycodestyle",
    "pyflakes",
    "pyright",
    "pytest",
    "ruff",
    "rust-just",
]

[tool.isort]
profile = "black"

[tool.mypy]
explicit_package_bases = true
strict = true
mypy_path = ["stubs"]

[tool.pyright]
typeCheckingMode = "strict"
stubPath = "stubs"
extraPaths = ["stubs"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "C901",    # complex-structure - HTML parsers are inherently complex
    "D100",    # undocumented-public-module - no docstrings required
    "D101",    # undocumented-public-class - no docstrings required
    "D107",    # undocumented-public-init - no docstrings required
    "DTZ001",  # flake8-datetimez - tzinfo for datetime not required
    "DTZ007",  # call-datetime-strptime-without-zone - tzinfo for datetime not required
    "E501",    # line-too-long - handled by formatter
    "EM101",   # raw-string-in-exception - acceptable in some cases
    "EM102",   # f-string-in-exception - acceptable in some cases
    "ERA001",  # commented-out-code - VERSION/AUTHORS/CHANGELOG comments are required by qBittorrent
    "INP001",  # implicit-namespace-package - plugins are standalone files, not packages
    "PLR0912", # too-many-branches - HTML parsers need many branches
    "PLR0915", # too-many-statements - HTML parsers need many statements
    "PLR2004", # magic-value-comparison - acceptable
    "RUF001",  # ambiguous-unicode-character-string - intentional Cyrillic for Ukrainian text
    "RUF100",  # unused-noqa - noqa directives are kept for clarity
    "S310",    # suspicious-url-open-for-nonliteral - URLs are controlled constants
    "SIM102",  # collapsible-if - readability preference
    "T201",    # print - required by qBittorrent search plugin API
    "TRY002",  # raise-vanilla-class - generic Exception is acceptable
    "TRY003",  # raise-vanilla-args - generic Exception is acceptable
    "UP045",   # non-pep604-annotation-optional - Optional[] is clearer
]

[tool.setuptools.packages.find]
where = ["./"]
